<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NativeLink Scheduler Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #12181f;
      --bg-tertiary: #1a222d;
      --bg-card: #151c25;
      --accent-cyan: #39bae6;
      --accent-green: #7fd962;
      --accent-orange: #ff9940;
      --accent-red: #f07178;
      --accent-purple: #d2a6ff;
      --text-primary: #e6e6e6;
      --text-secondary: #8a919a;
      --text-muted: #5c6370;
      --border-color: #1e2832;
      --glow-cyan: rgba(57, 186, 230, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 0%, rgba(57, 186, 230, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(127, 217, 98, 0.05) 0%, transparent 50%);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--bg-primary);
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .logo h1 span {
      color: var(--accent-cyan);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: var(--accent-green);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-cyan);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card.executing .stat-value {
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-red));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .stat-card.queued .stat-value {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .stat-card.completed .stat-value {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .stat-card.workers .stat-value {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: var(--bg-secondary);
      padding: 0.5rem;
      border-radius: 12px;
      width: fit-content;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--bg-tertiary);
      color: var(--accent-cyan);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-grid {
      display: grid;
      gap: 1rem;
    }

    .worker-card, .action-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      transition: border-color 0.2s;
    }

    .worker-card:hover, .action-card:hover {
      border-color: var(--accent-cyan);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .card-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent-cyan);
      word-break: break-all;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge.executing {
      background: rgba(255, 153, 64, 0.15);
      color: var(--accent-orange);
      border: 1px solid rgba(255, 153, 64, 0.3);
    }

    .status-badge.idle {
      background: rgba(127, 217, 98, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(127, 217, 98, 0.3);
    }

    .status-badge.paused {
      background: rgba(240, 113, 120, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(240, 113, 120, 0.3);
    }

    .status-badge.draining {
      background: rgba(210, 166, 255, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(210, 166, 255, 0.3);
    }

    .properties-section {
      margin-top: 1rem;
    }

    .properties-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .properties-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .property-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      background: var(--bg-tertiary);
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .property-key {
      color: var(--accent-purple);
    }

    .property-value {
      color: var(--accent-green);
    }

    .running-action {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 153, 64, 0.05);
      border: 1px solid rgba(255, 153, 64, 0.2);
      border-radius: 8px;
    }

    .running-action-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-orange);
      margin-bottom: 0.5rem;
    }

    .digest {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .worker-link {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(57, 186, 230, 0.05);
      border: 1px solid rgba(57, 186, 230, 0.2);
      border-radius: 8px;
    }

    .worker-link-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      margin-bottom: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .timestamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .action-stage {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .stage-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-orange);
      animation: pulse 1.5s infinite;
    }

    .stage-text {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">NL</div>
        <h1>Native<span>Link</span> Scheduler</h1>
      </div>
      <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="connectionText">Disconnected</span>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card executing">
        <div class="stat-label">Executing</div>
        <div class="stat-value" id="executingCount">0</div>
      </div>
      <div class="stat-card queued">
        <div class="stat-label">Queued</div>
        <div class="stat-value" id="queuedCount">0</div>
      </div>
      <div class="stat-card completed">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>
      <div class="stat-card workers">
        <div class="stat-label">Workers</div>
        <div class="stat-value" id="workersCount">0</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="workers">Workers</button>
      <button class="tab" data-tab="actions">Actions</button>
    </div>

    <div id="workersTab" class="tab-content active">
      <div class="card-grid" id="workersGrid">
        <div class="empty-state">
          <div class="empty-state-icon">⚡</div>
          <p>Waiting for data...</p>
        </div>
      </div>
    </div>

    <div id="actionsTab" class="tab-content">
      <div class="card-grid" id="actionsGrid">
        <div class="empty-state">
          <div class="empty-state-icon">🔄</div>
          <p>No executing actions</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SSE_URL = '/scheduler/MAIN_SCHEDULER/state';
    
    let eventSource = null;
    let currentData = null;
    let workersMap = new Map();

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
      });
    });

    function formatTimestamp(secs, nanos) {
      if (!secs) return 'N/A';
      const date = new Date(secs * 1000 + Math.floor(nanos / 1000000));
      return date.toLocaleString();
    }

    function formatPropertyValue(value) {
      if (typeof value === 'object') {
        if (value.Priority !== undefined) return `priority: ${value.Priority || 'any'}`;
        if (value.Minimum !== undefined) return `min: ${value.Minimum}`;
        if (value.Exact !== undefined) return value.Exact;
        return JSON.stringify(value);
      }
      return String(value);
    }

    function renderProperties(properties) {
      if (!properties || !properties.properties) return '';
      
      const props = properties.properties;
      return Object.entries(props).map(([key, value]) => `
        <div class="property-tag">
          <span class="property-key">${key}</span>
          <span class="property-value">${formatPropertyValue(value)}</span>
        </div>
      `).join('');
    }

    function getWorkerStatus(worker) {
      if (worker.is_paused) return 'paused';
      if (worker.is_draining) return 'draining';
      const runningActions = Object.keys(worker.running_action_infos || {});
      return runningActions.length > 0 ? 'executing' : 'idle';
    }

    function getWorkerStatusLabel(worker) {
      if (worker.is_paused) return 'Paused';
      if (worker.is_draining) return 'Draining';
      const runningActions = Object.keys(worker.running_action_infos || {});
      return runningActions.length > 0 ? `Executing (${runningActions.length})` : 'Idle';
    }

    function renderWorkers(workers) {
      if (!workers || workers.length === 0) {
        return `
          <div class="empty-state">
            <div class="empty-state-icon">👷</div>
            <p>No workers connected</p>
          </div>
        `;
      }

      return workers.map(worker => {
        const status = getWorkerStatus(worker);
        const statusLabel = getWorkerStatusLabel(worker);
        const runningActions = Object.entries(worker.running_action_infos || {});
        
        return `
          <div class="worker-card">
            <div class="card-header">
              <div class="card-title">${worker.id}</div>
              <span class="status-badge ${status}">${statusLabel}</span>
            </div>
            
            <div class="timestamp">Last update: ${formatTimestamp(worker.last_update_timestamp, 0)}</div>
            
            <div class="properties-section">
              <div class="properties-title">Platform Properties</div>
              <div class="properties-grid">
                ${renderProperties(worker.platform_properties)}
              </div>
            </div>
            
            ${runningActions.length > 0 ? `
              <div class="running-action">
                <div class="running-action-title">Running Actions</div>
                ${runningActions.map(([opId, action]) => `
                  <div class="digest">
                    Operation: ${opId}<br>
                    Digest: ${action.action_info?.inner?.unique_qualifier?.Cacheable?.digest || 'N/A'}
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderActions(actions, workers) {
      const executingActions = actions?.executing_actions || [];
      
      if (executingActions.length === 0) {
        return `
          <div class="empty-state">
            <div class="empty-state-icon">✅</div>
            <p>No actions currently executing</p>
          </div>
        `;
      }

      // Create a map of workers for quick lookup
      const workersById = new Map();
      (workers || []).forEach(w => workersById.set(w.id, w));

      return executingActions.map(action => {
        const workerId = action.worker_id;
        const worker = workersById.get(workerId);
        const stage = action.state?.stage || 'Unknown';
        const actionDigest = action.state?.action_digest || 'N/A';
        const operationId = action.operation_id?.Uuid || 'N/A';
        
        return `
          <div class="action-card">
            <div class="card-header">
              <div class="card-title">${operationId}</div>
              <span class="status-badge executing">${stage}</span>
            </div>
            
            <div class="action-stage">
              <div class="stage-indicator"></div>
              <span class="stage-text">Action Digest: ${actionDigest}</span>
            </div>
            
            <div class="timestamp">
              Started: ${formatTimestamp(
                action.state?.last_transition_timestamp?.secs_since_epoch,
                action.state?.last_transition_timestamp?.nanos_since_epoch
              )}
            </div>
            
            <div class="properties-section">
              <div class="properties-title">Action Info</div>
              <div class="properties-grid">
                <div class="property-tag">
                  <span class="property-key">priority</span>
                  <span class="property-value">${action.action_info?.priority || 0}</span>
                </div>
                <div class="property-tag">
                  <span class="property-key">attempts</span>
                  <span class="property-value">${action.attempts || 0}</span>
                </div>
              </div>
            </div>
            
            ${worker ? `
              <div class="worker-link">
                <div class="worker-link-title">Assigned Worker</div>
                <div class="card-title" style="margin-bottom: 0.75rem;">${workerId}</div>
                <div class="properties-grid">
                  ${renderProperties(worker.platform_properties)}
                </div>
              </div>
            ` : `
              <div class="worker-link">
                <div class="worker-link-title">Assigned Worker</div>
                <div class="card-title">${workerId || 'Unassigned'}</div>
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function updateUI(data) {
      currentData = data;
      
      // Update stats
      document.getElementById('executingCount').textContent = data.actions?.executing || 0;
      document.getElementById('queuedCount').textContent = data.actions?.queued || 0;
      document.getElementById('completedCount').textContent = data.actions?.completed || 0;
      document.getElementById('workersCount').textContent = data.workers?.length || 0;
      
      // Update workers grid
      document.getElementById('workersGrid').innerHTML = renderWorkers(data.workers);
      
      // Update actions grid
      document.getElementById('actionsGrid').innerHTML = renderActions(data.actions, data.workers);
    }

    function setConnectionStatus(connected) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('connectionText');
      
      if (connected) {
        dot.classList.add('connected');
        text.textContent = 'Connected';
      } else {
        dot.classList.remove('connected');
        text.textContent = 'Disconnected';
      }
    }

    function connect() {
      if (eventSource) {
        eventSource.close();
      }

      eventSource = new EventSource(SSE_URL);

      eventSource.onopen = () => {
        console.log('SSE connection established');
        setConnectionStatus(true);
      };

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          updateUI(data);
        } catch (e) {
          console.error('Error parsing SSE data:', e);
        }
      };

      eventSource.onerror = (error) => {
        console.error('SSE connection error:', error);
        setConnectionStatus(false);
        
        // Attempt to reconnect after 5 seconds
        setTimeout(() => {
          console.log('Attempting to reconnect...');
          connect();
        }, 5000);
      };
    }

    // Start connection
    connect();

    // For demo purposes - load sample data if provided
    // Remove this in production
    const sampleData = null; // Set to sample JSON for testing without SSE
    if (sampleData) {
      updateUI(sampleData);
      setConnectionStatus(true);
    }
  </script>
</body>
</html>
